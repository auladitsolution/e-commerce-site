<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bag Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />

  <!-- Shopping Bag Group -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path
      d="M196 210 V160 C196 126.86 222.86 100 256 100 C289.14 100 316 126.86 316 160 V210"
      fill="none"
      stroke="url(#handleGrad)"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- Bag Body -->
    <path
      d="M136 200 L160 410 C162 426.5 176 438 192.6 438 H319.4 C336 438 350 426.5 352 410 L376 200 C378 184 366 170 350 170 H162 C146 170 134 184 136 200 Z"
      fill="#ffffff"
    />

    <!-- Bag Fold Highlight -->
    <path
      d="M162 170 H350 C366 170 378 184 376 200 L372 235 C340 215 172 215 140 235 L136 200 C134 184 146 170 162 170 Z"
      fill="#f1f5f9"
    />
  </g>

  <!-- Energy / Speed Spark (Thunderbolt) -->
  <g filter="url(#glow)">
    <polygon
      points="272,215 220,305 254,305 240,395 296,295 262,295"
      fill="url(#goldGrad)"
    />
  </g>

  <!-- Top-Right Sparkle Star -->
  <path
    d="M382 105 C382 120 395 132 410 132 C395 132 382 144 382 160 C382 144 370 132 354 132 C370 132 382 120 382 105 Z"
    fill="url(#goldGrad)"
  />
</svg>
